<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('라이브러리와 실행 환경', ~{::section})}">

<body>
    <section>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h3 mb-0">라이브러리와 실행 환경</h1>
            <a class="btn btn-outline-secondary" th:href="@{/admin/firebase}">Firebase</a>
        </div>

        <dl class="row border-bottom pb-3 mb-4">
            <dt class="col-sm-3">환경</dt>
            <dd class="col-sm-9" th:text="${environmentName}">개발</dd>
            <dt class="col-sm-3">Profile</dt>
            <dd class="col-sm-9" th:text="${profiles}">dev</dd>
        </dl>

        <div class="accordion mb-4" id="library-accordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#library-content" aria-expanded="false" aria-controls="library-content">
                        라이브러리 정보
                    </button>
                </h2>
                <div id="library-content" class="accordion-collapse collapse" data-bs-parent="#library-accordion">
                    <div class="accordion-body">Bootstrap 5.3.8 · Apache Commons Lang</div>
                </div>
            </div>
        </div>

        <h2 class="h5">문자열 검사</h2>
        <form th:action="@{/admin/etc/text}" th:object="${textForm}" method="post">
            <div class="mb-3">
                <label for="text" class="form-label">문자열</label>
                <textarea id="text" th:field="*{text}" class="form-control" rows="3" maxlength="1000"
                    th:classappend="${#fields.hasErrors('text')} ? 'is-invalid' : ''"></textarea>
                <div class="invalid-feedback" th:errors="*{text}"></div>
            </div>
            <button type="submit" class="btn btn-success">검사</button>
        </form>

        <div th:if="${textResult != null}" class="border-top mt-4 pt-4" role="status">
            <h2 class="h5">검사 결과</h2>
            <dl class="row">
                <dt class="col-sm-3">내용 유무</dt>
                <dd class="col-sm-9" th:text="${textResult.hasText()}">true</dd>
                <dt class="col-sm-3">길이</dt>
                <dd class="col-sm-9" th:text="${textResult.length()}">6</dd>
                <dt class="col-sm-3">양끝 공백 제거</dt>
                <dd class="col-sm-9 text-break" style="white-space: pre-wrap;" th:text="${textResult.stripped()}">Spring
                </dd>
            </dl>
        </div>
    </section>
</body>

</html>
