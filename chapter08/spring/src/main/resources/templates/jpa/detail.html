<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
</head>

<body>
    <h1 th:text="${board.title}">제목</h1>

    <p>작성자: <span th:text="${board.writer}">작성자</span></p>
    <p>작성일: <span th:text="${board.createdAt}">작성일</span></p>
    <hr>
    <p th:text="${board.content}">내용</p>

    <p>
        <a th:href="@{/jpa/boards/{id}/edit(id=${board.id})}">수정</a>
        <a th:href="@{/jpa/boards}">목록</a>
    </p>

    <form th:action="@{/jpa/boards/{id}/delete(id=${board.id})}" method="post">
        <button type="submit">삭제</button>
    </form>
</body>

</html>
