<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('게시글 입력', ~{::section})}">
<section class="mx-auto" style="max-width: 760px;">
    <div class="mb-4">
        <h1 class="h3 mb-1">게시글 입력</h1>
        <p class="text-muted mb-0">제목, 작성자, 내용을 입력하세요.</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${boardId == null} ? @{/jpa/boards} : @{/jpa/boards/{id}/edit(id=${boardId})}"
                th:object="${boardForm}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">제목</label>
                    <input type="text" class="form-control"
                        th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" th:field="*{title}">
                    <div class="invalid-feedback" th:errors="*{title}">제목 오류</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">작성자</label>
                    <input type="text" class="form-control"
                        th:classappend="${#fields.hasErrors('writer')} ? 'is-invalid'" th:field="*{writer}">
                    <div class="invalid-feedback" th:errors="*{writer}">작성자 오류</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">내용</label>
                    <textarea class="form-control" rows="8"
                        th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                        th:field="*{content}"></textarea>
                    <div class="invalid-feedback" th:errors="*{content}">내용 오류</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a class="btn btn-outline-secondary" th:href="@{/jpa/boards}">목록</a>
                </div>
            </form>
        </div>
    </div>
</section>

</html>
