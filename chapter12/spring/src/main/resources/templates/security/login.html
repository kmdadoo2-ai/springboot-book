<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('로그인', ~{::section})}">
<section class="mx-auto" style="max-width: 420px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">로그인</h1>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">아이디</label>
                    <input type="text" name="username" class="form-control" autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input type="password" name="password" class="form-control">
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <div th:if="${param.logout}" class="alert alert-success py-2">
                    로그아웃되었습니다.
                </div>

                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>

            <div class="text-center mt-3">
                <a class="text-decoration-none" th:href="@{/jpa/boards}">게시판으로</a>
            </div>
        </div>
    </div>
</section>

</html>
