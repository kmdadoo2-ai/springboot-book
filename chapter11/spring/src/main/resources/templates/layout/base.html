<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">게시판</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/jpa/boards}">Spring Board</a>

            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/jpa/boards}">게시판</a>
                <a class="btn btn-sm btn-outline-dark" th:href="@{/api/boards}">API</a>

                <a sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-outline-danger" th:href="@{/admin}">관리자</a>

                <a sec:authorize="isAnonymous()" class="btn btn-sm btn-primary" th:href="@{/login}">로그인</a>

                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <span class="me-2 small text-muted">
                        <strong sec:authentication="name">user</strong> 님
                    </span>
                    <button type="submit" class="btn btn-sm btn-outline-primary">로그아웃</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <th:block th:replace="${content}"></th:block>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
