server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.bundle=web

spring.ssl.bundle.jks.web.keystore.location=${TLS_KEYSTORE}
spring.ssl.bundle.jks.web.keystore.password=${TLS_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.web.keystore.type=PKCS12
spring.ssl.bundle.jks.web.key.alias=${TLS_KEY_ALIAS:board}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax