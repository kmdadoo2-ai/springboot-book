<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/base :: layout('게시글 상세', ~{::section})}">
<section class="mx-auto" style="max-width: 820px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h1 class="h4 mb-0" th:text="${board.title}">제목</h1>
        </div>

        <div class="card-body p-4">
            <div class="d-flex gap-3 text-muted small mb-4">
                <span>
                    작성자:
                    <strong th:text="${board.writer}">작성자</strong>
                </span>
                <span>
                    작성일:
                    <strong th:text="${board.createdAt}">작성일</strong>
                </span>
            </div>

            <div class="border rounded bg-light p-3">
                <p class="mb-0" style="white-space: pre-line;" th:text="${board.content}">
                    내용
                </p>
            </div>
        </div>

        <div class="card-footer bg-white d-flex gap-2">
            <a sec:authorize="isAuthenticated()" class="btn btn-outline-primary"
                th:href="@{/jpa/boards/{id}/edit(id=${board.id})}">수정</a>

            <form sec:authorize="isAuthenticated()" th:action="@{/jpa/boards/{id}/delete(id=${board.id})}"
                method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger">삭제</button>
            </form>

            <a class="btn btn-secondary ms-auto" th:href="@{/jpa/boards}">목록</a>
        </div>
    </div>
</section>

</html>
