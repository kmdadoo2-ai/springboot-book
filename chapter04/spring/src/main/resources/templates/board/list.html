<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
</head>

<body>
    <h1>게시판 목록</h1>

    <p><a th:href="@{/boards/new}">글쓰기</a></p>

    <table border="1">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
        </tr>
        <tr th:each="board : ${boards}">
            <td th:text="${board.id}">1</td>
            <td>
                <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a>
            </td>
            <td th:text="${board.writer}">작성자</td>
            <td th:text="${board.createdAt}">작성일</td>
        </tr>
    </table>
</body>

</html>
